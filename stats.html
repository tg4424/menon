const $ = (s) => document.querySelector(s);
const esc = (x) => String(x ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (w, n) => (n ? (100 * w / n) : 0);
const nm = (kind, id) => (NAMES[kind] && NAMES[kind][id]) || id;
try { const k = localStorage.getItem("menon_stats_key"); if (k) { $("#key").value = k; $("#remember").checked = true; } } catch (e) {}
function bar(p, sim) {
  return `<div class="bar"><em></em><i style="width:${Math.max(0, Math.min(100, p))}%"></i>${sim != null ? `<u style="left:${sim}%"></u>` : ""}</div>`;
}
function rateCell(w, n) { const p = pct(w, n); const cls = n < 20 ? "few" : p < 45 ? "low" : p > 55 ? "high" : ""; return `<td class="n ${cls}">${n ? p.toFixed(1) + "%" : "—"}</td>`; }
function table(id, head, rows) {
  return `<table id="${id}"><thead><tr>${head.map((h, i) => `<th data-i="${i}">${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table>`;
}
function sortable(root) {
  root.querySelectorAll("table").forEach((tb) => tb.querySelectorAll("th").forEach((th) => th.addEventListener("click", () => {
    const i = +th.dataset.i, body = tb.tBodies[0], rs = [...body.rows], asc = th.dataset.asc !== "1";
    const v = (r) => { const t = r.cells[i].textContent.replace(/[%,]/g, ""); const n = parseFloat(t); return isNaN(n) ? t : n; };
    rs.sort((a, b) => (v(a) > v(b) ? 1 : v(a) < v(b) ? -1 : 0) * (asc ? 1 : -1)); rs.forEach((r) => body.appendChild(r));
    tb.querySelectorAll("th").forEach((x) => delete x.dataset.asc); th.dataset.asc = asc ? "1" : "0";
  })));
}
async function load() {
  const key = $("#key").value.trim(), out = $("#out");
  if (!key) { out.innerHTML = `<div class="msg err">請輸入金鑰。</div>`; return; }
  try { if ($("#remember").checked) localStorage.setItem("menon_stats_key", key); else localStorage.removeItem("menon_stats_key"); } catch (e) {}
  out.innerHTML = `<div class="msg">讀取中…</div>`;
  let d;
  try {
    const res = await fetch(CFG.url + "/rest/v1/rpc/menon_stats", { method: "POST", headers: { apikey: CFG.anon, "Content-Type": "application/json" },
      body: JSON.stringify({ p_key: key, p_days: +$("#days").value, p_ver: $("#ver").value || null }) });
    if (!res.ok) { out.innerHTML = `<div class="msg err">讀取失敗（${res.status}）。金鑰可能不對，或還沒在 Supabase 執行 telemetry_setup.sql。</div>`; return; }
    d = await res.json();
  } catch (e) { out.innerHTML = `<div class="msg err">連不上伺服器：${esc(e.message)}</div>`; return; }
  render(d);
}
function render(d) {
  const diff = $("#diff").value, fd = (x) => !diff || x.diff === diff;
  const vs = $("#ver"), cur = vs.value;
  vs.innerHTML = `<option value="">所有版本</option>` + Object.entries(d.versions || {}).sort().reverse().map(([v, n]) => `<option value="${esc(v)}"${v === cur ? " selected" : ""}>v${esc(v)}（${n} 局）</option>`).join("");
  const T = d.totals || {};
  let h = `<div class="tiles">
    <div class="tile"><b>${T.runs || 0}</b><span>局數</span></div>
    <div class="tile"><b>${T.runs ? pct(T.wins, T.runs).toFixed(1) : 0}%</b><span>整體勝率（所有難度）</span></div>
    <div class="tile"><b>${d.battles_total || 0}</b><span>戰鬥場數</span></div>
    <div class="tile"><b>${T.devices || 0}</b><span>裝置數（約等於玩家數）</span></div></div><div class="grid">`;
  // 角色
  const ch = {}; for (const x of (d.by_char || []).filter(fd)) { const k = x.ch + (x.stance ? ":" + x.stance : ""); const o = ch[k] || (ch[k] = { runs: 0, wins: 0, steps: 0 }); o.runs += x.runs; o.wins += x.wins; o.steps += x.steps * x.runs; }
  h += `<section><h2>角色</h2>` + table("t-ch", ["角色", "局數", "勝率", "", "模擬", "平均步數"], Object.entries(ch).sort((a, b) => b[1].runs - a[1].runs).map(([k, o]) => {
    const s = diff === "normal" ? SIM.ch[k] : null, [c, st] = k.split(":");
    return `<tr><td>${esc(nm("ch", c))}${st ? "・" + (st === "sword" ? "劍" : "盾") : ""}</td><td class="n">${o.runs}</td>${rateCell(o.wins, o.runs)}<td>${bar(pct(o.wins, o.runs), s)}</td><td class="n">${s != null ? s + "%" : "—"}</td><td class="n">${(o.steps / o.runs).toFixed(1)}</td></tr>`; })) + `</section>`;
  // 祝福
  const bl = {}; for (const x of (d.by_bless || []).filter(fd)) { const o = bl[x.bless] || (bl[x.bless] = { runs: 0, wins: 0 }); o.runs += x.runs; o.wins += x.wins; }
  h += `<section><h2>主神的祝福</h2>` + table("t-bl", ["祝福", "局數", "勝率", "", "模擬"], Object.entries(bl).sort((a, b) => b[1].runs - a[1].runs).map(([k, o]) => {
    const s = diff === "normal" ? SIM.bl[k] : null;
    return `<tr><td>${esc(nm("bless", k))}</td><td class="n">${o.runs}</td>${rateCell(o.wins, o.runs)}<td>${bar(pct(o.wins, o.runs), s)}</td><td class="n">${s != null ? s + "%" : "—"}</td></tr>`; })) + `</section>`;
  // 死在第幾步
  const ds = d.death_step || {}, mx = Math.max(1, ...Object.values(ds));
  h += `<section><h2>輸掉的局：死在第幾步</h2><div class="hist">${Array.from({ length: 13 }, (_, i) => `<div data-l="${i}" style="height:${100 * (ds[i] || 0) / mx}%" title="第 ${i} 步：${ds[i] || 0} 局"></div>`).join("")}</div><div style="height:22px"></div>
    <div class="sub">結果：${Object.entries(d.by_result || {}).map(([k, v]) => `${esc({ lost: "輸", win_kill: "擊敗 Boss", win_spare: "放過 Boss" }[k] || k)} ${v}`).join("｜")}</div></section>`;
  // 叮嚀
  h += `<section><h2>神的叮嚀</h2>` + table("t-wh", ["叮嚀", "持有局數", "勝率", ""], (d.whispers || []).sort((a, b) => b.runs - a.runs).map((x) =>
    `<tr><td>${esc(nm("whisper", x.whisper))}</td><td class="n">${x.runs}</td>${rateCell(x.wins, x.runs)}<td>${bar(pct(x.wins, x.runs))}</td></tr>`)) + `</section>`;
  h += `</div><div class="grid" style="margin-top:14px">`;
  // 敵人
  h += `<section><h2>敵人（依擊敗玩家的比例排序）</h2>` + table("t-en", ["敵人", "種類", "場數", "擊敗玩家", "被放過", "平均失血", "平均回合"], (d.by_enemy || []).sort((a, b) => b.deaths / b.fights - a.deaths / a.fights).map((x) =>
    `<tr class="${x.fights < 20 ? "few" : ""}"><td>${esc(nm("enemy", x.enemy))}</td><td>${esc({ normal: "一般", elite: "菁英", boss: "Boss" }[x.kind] || x.kind)}</td><td class="n">${x.fights}</td><td class="n">${pct(x.deaths, x.fights).toFixed(1)}%</td><td class="n">${pct(x.spared, x.fights).toFixed(1)}%</td><td class="n">${x.hp_lost}</td><td class="n">${x.turns}</td></tr>`)) + `</section>`;
  // 卡牌
  const played = d.cards_played || {};
  h += `<section><h2>卡牌（在最後牌組裡的局數與勝率）</h2>` + table("t-cd", ["牌", "星", "局數", "勝率", "被打出"], (d.cards_deck || []).sort((a, b) => b.runs - a.runs).map((x) =>
    `<tr class="${x.runs < 20 ? "few" : ""}"><td>${esc(nm("card", x.card))}</td><td class="n">${(NAMES.star || {})[x.card] || ""}</td><td class="n">${x.runs}</td>${rateCell(x.wins, x.runs)}<td class="n">${played[x.card] || 0}</td></tr>`)) + `</section>`;
  h += `</div><p class="sub" style="margin-top:14px">資料從 ${esc(new Date(d.since).toLocaleDateString())} 起。點表頭可以排序。勝率只在樣本夠多（約 100 局以上）時才可靠。</p>`;
  $("#out").innerHTML = h; sortable($("#out"));
}
